<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kalendar Rezervacija</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #2c3e50; }
        .nav-btn { background: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .nav-btn:hover { background: #2980b9; }

        /* CSS Kalendar Grid */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .day-header { font-weight: bold; background: #eef2f5; padding: 10px; border-radius: 6px; color: #555; }
        
        .day-card { background: #fff; border: 1px solid #e0e0e0; min-height: 85px; border-radius: 8px; padding: 8px; text-align: left; cursor: pointer; transition: all 0.2s; position: relative; }
        .day-card:hover { border-color: #3498db; background-color: #f0f8ff; transform: translateY(-2px); }
        .day-number { font-size: 14px; font-weight: bold; color: #333; }
        .day-card.other-month { opacity: 0.3; cursor: default; }
        .day-card.other-month:hover { transform: none; background: #fff; border-color: #e0e0e0; }

        .badge { display: inline-block; margin-top: 8px; background: #e74c3c; color: white; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .badge.zero { background: #2ecc71; opacity: 0.8; }

        /* Modal / Pop-up za detalje dana */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
        
        .termin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .termin-item:last-child { border-bottom: none; }
        .btn-obrisi { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-obrisi:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="nav-btn" onclick="promijeniMjesec(-1)">&lt; Prethodni</button>
        <h2 id="mjesecGodina"></h2>
        <button class="nav-btn" onclick="promijeniMjesec(1)">Sljedeći &gt;</button>
    </div>

    <div class="calendar-grid" id="kalendar">
        <!-- Generira JS -->
    </div>
</div>

<!-- Modal prozor za detalje odabranog dana -->
<div class="modal" id="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="zatvoriModal()">&times;</button>
        <h3 id="modalNaslov">Detalji termina</h3>
        <div id="modalListaTermina"></div>
    </div>
</div>

<script>
    let danasnjiDatum = new Date();
    let trenutniMjesec = danasnjiDatum.getMonth();
    let trenutnaGodina = danasnjiDatum.getFullYear();
    let sveRezervacije = [];

    const naziviMjeseci = ["Siječanj", "Veljača", "Ožujak", "Travanj", "Svibanj", "Lipanj", "Srpanj", "Kolovoz", "Rujan", "Listopad", "Studeni", "Prosinac"];
    const daniTjedna = ["Pon", "Uto", "Sri", "Čet", "Pet", "Sub", "Ned"];

    async function ucitajPodatke() {
        try {
            const res = await fetch('/api/rezervacije');
            sveRezervacije = await res.json();
            prikaziKalendar();
        } catch (err) {
            console.error("Greška pri dohvaćanju rezervacija:", err);
        }
    }

    function prikaziKalendar() {
        document.getElementById('mjesecGodina').textContent = `${naziviMjeseci[trenutniMjesec]} ${trenutnaGodina}.`;
        const kalendarGrid = document.getElementById('kalendar');
        kalendarGrid.innerHTML = '';

        // Zaglavlje za dane u tjednu
        daniTjedna.forEach(dan => {
            const el = document.createElement('div');
            el.className = 'day-header';
            el.textContent = dan;
            kalendarGrid.appendChild(el);
        });

        const prviDanMjeseca = new Date(trenutnaGodina, trenutniMjesec, 1).getDay();
        // Prilagodba za europske tjedne (Ponedjeljak = 0)
        let offset = prviDanMjeseca === 0 ? 6 : prviDanMjeseca - 1;
        const brojDanaUMjesecu = new Date(trenutnaGodina, trenutniMjesec + 1, 0).getDate();

        // Prazna polja prije prvog dana u mjesecu
        for (let i = 0; i < offset; i++) {
            const blank = document.createElement('div');
            blank.className = 'day-card other-month';
            kalendarGrid.appendChild(blank);
        }

        // Generiranje polja za svaki dan u mjesecu
        for (let dan = 1; dan <= brojDanaUMjesecu; dan++) {
            const m = String(trenutniMjesec + 1).padStart(2, '0');
            const d = String(dan).padStart(2, '0');
            const formatiraniDatum = `${trenutnaGodina}-${m}-${d}`;

            // Prebrojavanje termina za ovaj dan
            const terminiZaDan = sveRezervacije.filter(r => r.datum === formatiraniDatum);
            const brojTermina = terminiZaDan.length;

            const card = document.createElement('div');
            card.className = 'day-card';
            card.onclick = () => otvoriModalZaDan(formatiraniDatum, terminiZaDan);

            const labelaBroj = document.createElement('div');
            labelaBroj.className = 'day-number';
            labelaBroj.textContent = dan;
            card.appendChild(labelaBroj);

            const badge = document.createElement('div');
            if (brojTermina > 0) {
                badge.className = 'badge';
                badge.textContent = `${brojTermina} termin${brojTermina > 1 ? 'a' : ''}`;
            } else {
                badge.className = 'badge zero';
                badge.textContent = 'Slobodno';
            }
            card.appendChild(badge);

            kalendarGrid.appendChild(card);
        }
    }

    function promijeniMjesec(smjer) {
        trenutniMjesec += smjer;
        if (trenutniMjesec < 0) {
            trenutniMjesec = 11;
            trenutnaGodina--;
        } else if (trenutniMjesec > 11) {
            trenutniMjesec = 0;
            trenutnaGodina++;
        }
        prikaziKalendar();
    }

    function otvoriModalZaDan(datum, termini) {
        document.getElementById('modalNaslov').textContent = `Termini za: ${datum}`;
        const lista = document.getElementById('modalListaTermina');
        lista.innerHTML = '';

        if (termini.length === 0) {
            lista.innerHTML = '<p style="color:#777;">Nema zakazanih termina za ovaj dan.</p>';
        } else {
            termini.forEach(t => {
                const item = document.createElement('div');
                item.className = 'termin-item';

                // textContent umjesto innerHTML, da se ime ne može izvršiti kao kod (XSS zaštita)
                const info = document.createElement('div');
                const vrijeme = document.createElement('strong');
                vrijeme.textContent = t.vrijeme;
                info.append(vrijeme, ' - ' + t.ime);

                const btn = document.createElement('button');
                btn.className = 'btn-obrisi';
                btn.textContent = 'Obriši';
                btn.onclick = () => obrisiTermin(t.id, datum);

                item.append(info, btn);
                lista.appendChild(item);
            });
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function zatvoriModal() {
        document.getElementById('modal').style.display = 'none';
    }

    async function obrisiTermin(id, datum) {
        if (confirm('Jeste li sigurni da želite obrisati ovaj termin?')) {
            await fetch(`/api/rezervacije/${id}`, { method: 'DELETE' });
            zatvoriModal();
            ucitajPodatke();
        }
    }

    ucitajPodatke();
</script>

</body>
</html>
