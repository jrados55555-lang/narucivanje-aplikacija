<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naručivanje</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 30px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #218838; }
        .poruka { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>Rezervacija termina</h2>
    
    <label for="ime">Ime i prezime:</label>
    <input type="text" id="ime" placeholder="Unesite vaše ime" maxlength="100" required />

    <label for="datum">Datum:</label>
    <input type="date" id="datum" required />

    <label for="vrijeme">Vrijeme (11:00 - 20:00):</label>
    <select id="vrijeme" required>
        <option value="">-- Odaberite datum prvo --</option>
    </select>

    <button id="btnSpremi">Potvrdi rezervaciju</button>
    <div id="poruka" class="poruka"></div>

    <script>
        const radnoVrijeme = [
            "11:00", "11:30", "12:00", "12:30", "13:00", "13:30",
            "14:00", "14:30", "15:00", "15:30", "16:00", "16:30",
            "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00"
        ];

        const datumInput = document.getElementById('datum');
        const vrijemeSelect = document.getElementById('vrijeme');
        
        // Postavi minimalni datum na danas (lokalni datum, ne UTC)
        const sad = new Date();
        datumInput.min = `${sad.getFullYear()}-${String(sad.getMonth() + 1).padStart(2, '0')}-${String(sad.getDate()).padStart(2, '0')}`;

        datumInput.addEventListener('change', async () => {
            const odabraniDatum = datumInput.value;
            if (!odabraniDatum) return;

            // Server vraća samo zauzeta vremena (bez imena klijenata)
            const res = await fetch('/api/zauzeto?datum=' + encodeURIComponent(odabraniDatum));
            const zauzetiTermini = await res.json();

            vrijemeSelect.innerHTML = '<option value="">-- Odaberite vrijeme --</option>';
            
            radnoVrijeme.forEach(sat => {
                const option = document.createElement('option');
                option.value = sat;
                if (zauzetiTermini.includes(sat)) {
                    option.textContent = `${sat} (Zauzeto)`;
                    option.disabled = true;
                } else {
                    option.textContent = sat;
                }
                vrijemeSelect.appendChild(option);
            });
        });

        document.getElementById('btnSpremi').addEventListener('click', async () => {
            const ime = document.getElementById('ime').value;
            const datum = datumInput.value;
            const vrijeme = vrijemeSelect.value;
            const porukaDiv = document.getElementById('poruka');

            if (!ime || !datum || !vrijeme) {
                porukaDiv.style.color = 'red';
                porukaDiv.textContent = 'Molimo ispunite sva polja!';
                return;
            }

            const res = await fetch('/api/rezervacije', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ime, datum, vrijeme })
            });

            if (res.ok) {
                porukaDiv.style.color = 'green';
                porukaDiv.textContent = 'Uspješno ste rezervirali termin!';
                document.getElementById('ime').value = '';
                datumInput.value = '';
                vrijemeSelect.innerHTML = '<option value="">-- Odaberite datum prvo --</option>';
            } else {
                porukaDiv.style.color = 'red';
                porukaDiv.textContent = 'Termin je u međuvremenu zauzet.';
            }
        });
    </script>
</body>
</html>
