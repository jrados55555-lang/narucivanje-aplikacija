<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rezervacija termina</title>
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        [hidden] { display: none !important; }

        /* Boje se postavljaju iz postavki salona (JS ih mijenja) */
        :root { --bg: #363435; --fg: #ffffff; --accent: #d32f2f; --accent-fg: #ffffff; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }
        .wrap {
            max-width: 440px;
            margin: 0 auto;
            padding: 24px 16px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .logo { display: block; margin: 0 auto 8px; max-width: min(80%, 300px); max-height: 220px; height: auto; }
        .naziv { margin: 0 0 8px; text-align: center; font-size: 28px; }
        h2 { margin: 0 0 6px; font-size: 22px; text-align: center; }
        .tel { margin: 0 0 6px; text-align: center; opacity: 0.85; font-size: 14px; }
        .tel a { color: inherit; }

        label { display: block; margin-top: 14px; font-weight: bold; }

        /* font-size 16px sprječava automatsko zumiranje na iPhoneu */
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 16px;
            min-height: 48px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-family: inherit;
        }
        input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

        button {
            background-color: var(--accent);
            color: var(--accent-fg);
            border: none;
            font-size: 17px;
            margin-top: 22px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        button:hover { filter: brightness(0.88); }
        button:active { filter: brightness(0.75); }

        .poruka { margin-top: 15px; padding: 10px; font-weight: bold; text-align: center; border-radius: 6px; }
        .poruka:empty { display: none; }
        .poruka.ok { background: #e8f5e9; color: #1b5e20; }
        .poruka.greska { background: #ffebee; color: #b71c1c; }

        .napomena { margin: 6px 0 0; font-size: 13px; opacity: 0.85; }

        /* Cjenik */
        .cjenik {
            margin: 14px 0 6px;
            padding: 12px 14px;
            border: 1px solid color-mix(in srgb, var(--fg) 25%, var(--bg));
            border-radius: 8px;
            background: color-mix(in srgb, var(--bg) 88%, black);
        }
        .cjenik h3 { margin: 0 0 8px; font-size: 16px; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
        .cjenik ul { list-style: none; margin: 0; padding: 0; }
        .cjenik li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed color-mix(in srgb, var(--fg) 25%, var(--bg)); }
        .cjenik li:last-child { border-bottom: none; }
        .cjenik li strong { white-space: nowrap; }

        /* Gumb "Dodaj u kalendar" nakon uspješne rezervacije */
        .kalendar-box { margin-top: 14px; text-align: center; }
        .gumb-link {
            display: block;
            padding: 12px;
            min-height: 48px;
            line-height: 24px;
            border: 2px solid var(--accent);
            border-radius: 6px;
            color: var(--fg);
            font-weight: bold;
            text-decoration: none;
        }
        .gumb-link:active { background: var(--accent); color: var(--accent-fg); }
        .kalendar-napomena { margin: 8px 0 0; font-size: 13px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="wrap">
        <img id="logo" class="logo" alt="" hidden>
        <h1 id="naziv" class="naziv" hidden></h1>

        <h2>Rezervacija termina</h2>
        <p id="salonTel" class="tel" hidden></p>

        <div id="cjenik" class="cjenik" hidden>
            <h3>Cjenik</h3>
            <ul id="cjenikLista"></ul>
        </div>

        <label for="ime">Ime i prezime:</label>
        <input type="text" id="ime" placeholder="Unesite vaše ime" maxlength="100" autocomplete="name" required />

        <label for="telefon">Broj telefona:</label>
        <input type="tel" id="telefon" placeholder="npr. 091 234 5678" maxlength="20" autocomplete="tel" required />

        <label for="datum">Datum:</label>
        <input type="date" id="datum" required />
        <p id="neradniNapomena" class="napomena" hidden></p>

        <label for="vrijeme" id="vrijemeLabel">Vrijeme:</label>
        <select id="vrijeme" required>
            <option value="">-- Odaberite datum prvo --</option>
        </select>

        <button id="btnSpremi">Potvrdi rezervaciju</button>
        <div id="poruka" class="poruka"></div>

        <div id="kalendarBox" class="kalendar-box" hidden>
            <a id="kalendarLink" class="gumb-link" href="#">Dodaj u kalendar (s podsjetnikom)</a>
            <p class="kalendar-napomena">Termin će vam se upisati u kalendar na mobitelu, da ga ne zaboravite.</p>
        </div>
    </div>

    <script>
        let radnoVrijeme = [];

        const datumInput = document.getElementById('datum');
        const vrijemeSelect = document.getElementById('vrijeme');
        const porukaDiv = document.getElementById('poruka');

        function prikaziPoruku(tekst, vrsta) {
            porukaDiv.className = 'poruka ' + vrsta;
            porukaDiv.textContent = tekst;
        }

        // Koliko je boja svijetla (0 = crna, 1 = bijela)
        function osvjetljenje(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function primijeniPostavke(p) {
            const root = document.documentElement.style;
            root.setProperty('--bg', p.pozadina);
            root.setProperty('--fg', osvjetljenje(p.pozadina) < 0.55 ? '#ffffff' : '#222222');
            root.setProperty('--accent', p.boja);
            root.setProperty('--accent-fg', osvjetljenje(p.boja) < 0.6 ? '#ffffff' : '#111111');

            document.title = p.naziv + ' - Rezervacija termina';

            // Logo; ako ne postoji, prikaži naziv salona tekstom
            const logo = document.getElementById('logo');
            const naziv = document.getElementById('naziv');
            naziv.textContent = p.naziv;
            logo.onload = () => { logo.hidden = false; };
            logo.onerror = () => { naziv.hidden = false; };
            logo.src = p.logo;

            if (p.telefon) {
                const tel = document.getElementById('salonTel');
                tel.textContent = 'Pitanja? Nazovite: ';
                const a = document.createElement('a');
                a.href = 'tel:' + p.telefon.replace(/[^\d+]/g, '');
                a.textContent = p.telefon;
                tel.appendChild(a);
                tel.hidden = false;
            }

            radnoVrijeme = p.termini;
            if (radnoVrijeme.length > 0) {
                document.getElementById('vrijemeLabel').textContent =
                    `Vrijeme (${radnoVrijeme[0]} - ${radnoVrijeme[radnoVrijeme.length - 1]}):`;
            }

            // Neradni dani u tjednu (npr. nedjelja)
            const imenaDana = ['', 'ponedjeljkom', 'utorkom', 'srijedom', 'četvrtkom', 'petkom', 'subotom', 'nedjeljom'];
            if (Array.isArray(p.neradniDani) && p.neradniDani.length > 0) {
                const n = document.getElementById('neradniNapomena');
                n.textContent = 'Ne radimo: ' + p.neradniDani.slice().sort((x, y) => x - y).map(d => imenaDana[d]).join(', ') + '.';
                n.hidden = false;
            }

            // Cjenik (iz postavki salona); ako je prazan, ne prikazuje se
            if (Array.isArray(p.cjenik) && p.cjenik.length > 0) {
                const lista = document.getElementById('cjenikLista');
                lista.innerHTML = '';
                p.cjenik.forEach(stavka => {
                    const li = document.createElement('li');
                    const naziv = document.createElement('span');
                    naziv.textContent = stavka.naziv;
                    const cijena = document.createElement('strong');
                    cijena.textContent = stavka.cijena;
                    li.append(naziv, cijena);
                    lista.appendChild(li);
                });
                document.getElementById('cjenik').hidden = false;
            }
        }

        async function ucitajPostavke() {
            try {
                const res = await fetch('/api/postavke');
                primijeniPostavke(await res.json());
            } catch (err) {
                prikaziPoruku('Greška pri učitavanju stranice. Osvježite je.', 'greska');
            }
        }

        // Postavi minimalni datum na danas (lokalni datum, ne UTC)
        const sad = new Date();
        datumInput.min = `${sad.getFullYear()}-${String(sad.getMonth() + 1).padStart(2, '0')}-${String(sad.getDate()).padStart(2, '0')}`;

        datumInput.addEventListener('change', async () => {
            const odabraniDatum = datumInput.value;
            if (!odabraniDatum) return;

            // Server vraća stanje dana (bez imena klijenata): je li dan zatvoren te koja su vremena zauzeta ili blokirana
            prikaziPoruku('', 'ok');
            document.getElementById('kalendarBox').hidden = true;

            let stanje;
            try {
                const res = await fetch('/api/zauzeto?datum=' + encodeURIComponent(odabraniDatum));
                stanje = await res.json();
            } catch (err) {
                prikaziPoruku('Greška pri učitavanju termina. Pokušajte ponovno.', 'greska');
                return;
            }

            if (stanje.zatvoren) {
                vrijemeSelect.innerHTML = '<option value="">-- Taj dan nije moguće rezervirati --</option>';
                prikaziPoruku('Na odabrani dan ne radimo. Molimo odaberite drugi datum.', 'greska');
                return;
            }

            vrijemeSelect.innerHTML = '<option value="">-- Odaberite vrijeme --</option>';

            radnoVrijeme.forEach(sat => {
                const option = document.createElement('option');
                option.value = sat;
                if (stanje.zauzeto.includes(sat)) {
                    option.textContent = `${sat} (Zauzeto)`;
                    option.disabled = true;
                } else if (stanje.blokirano.includes(sat)) {
                    option.textContent = `${sat} (Nedostupno)`;
                    option.disabled = true;
                } else {
                    option.textContent = sat;
                }
                vrijemeSelect.appendChild(option);
            });
        });

        document.getElementById('btnSpremi').addEventListener('click', async () => {
            const ime = document.getElementById('ime').value;
            const telefon = document.getElementById('telefon').value;
            const datum = datumInput.value;
            const vrijeme = vrijemeSelect.value;
            document.getElementById('kalendarBox').hidden = true;

            if (!ime || !telefon || !datum || !vrijeme) {
                prikaziPoruku('Molimo ispunite sva polja!', 'greska');
                return;
            }

            const res = await fetch('/api/rezervacije', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ime, telefon, datum, vrijeme })
            });

            if (res.ok) {
                const datumHr = datum.split('-').reverse().join('.') + '.';
                prikaziPoruku(`Uspješno ste rezervirali termin: ${datumHr} u ${vrijeme}`, 'ok');
                document.getElementById('kalendarLink').href =
                    `/api/kalendar?datum=${encodeURIComponent(datum)}&vrijeme=${encodeURIComponent(vrijeme)}`;
                document.getElementById('kalendarBox').hidden = false;
                document.getElementById('ime').value = '';
                document.getElementById('telefon').value = '';
                datumInput.value = '';
                vrijemeSelect.innerHTML = '<option value="">-- Odaberite datum prvo --</option>';
            } else if (res.status === 409) {
                prikaziPoruku('Termin je u međuvremenu zauzet ili nije dostupan. Odaberite drugi termin.', 'greska');
            } else if (res.status === 429) {
                prikaziPoruku('Previše pokušaja. Pokušajte ponovno za nekoliko minuta.', 'greska');
            } else {
                prikaziPoruku('Provjerite unesene podatke (ime, telefon, datum).', 'greska');
            }
        });

        ucitajPostavke();
    </script>
</body>
</html>
