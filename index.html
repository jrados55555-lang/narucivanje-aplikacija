<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naručivanje</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form, table { margin-bottom: 20px; max-width: 500px; }
        input, button { display: block; margin: 10px 0; padding: 8px; width: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Nova rezervacija</h2>
    <form id="forma">
        <input type="text" id="ime" placeholder="Vaše ime" required />
        <input type="date" id="datum" required />
        <input type="time" id="vrijeme" required />
        <button type="submit">Spremi rezervaciju</button>
    </form>

    <h2>Sve rezervacije</h2>
    <table>
        <thead>
            <tr>
                <th>Ime</th>
                <th>Datum</th>
                <th>Vrijeme</th>
            </tr>
        </thead>
        <tbody id="tablica-tijelo">
        </tbody>
    </table>

    <script>
        async function ucitajRezervacije() {
            const res = await fetch('/api/rezervacije');
            const podaci = await res.json();
            const tijelo = document.getElementById('tablica-tijelo');
            tijelo.innerHTML = '';
            
            podaci.forEach(r => {
                const red = `<tr>
                    <td>${r.ime}</td>
                    <td>${r.datum}</td>
                    <td>${r.vrijeme}</td>
                </tr>`;
                tijelo.innerHTML += red;
            });
        }

        document.getElementById('forma').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ime = document.getElementById('ime').value;
            const datum = document.getElementById('datum').value;
            const vrijeme = document.getElementById('vrijeme').value;

            await fetch('/api/rezervacije', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ime, datum, vrijeme })
            });

            document.getElementById('forma').reset();
            ucitajRezervacije();
        });

        ucitajRezervacije();
    </script>
</body>
</html>
