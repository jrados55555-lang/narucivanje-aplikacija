<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Prijava - Admin</title>
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        [hidden] { display: none !important; }

        /* Boje se postavljaju iz postavki salona (JS ih mijenja) */
        :root { --bg: #363435; --fg: #ffffff; --accent: #d32f2f; --accent-fg: #ffffff; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }
        .wrap {
            max-width: 380px;
            margin: 0 auto;
            padding: 32px 16px;
            padding-top: max(32px, env(safe-area-inset-top));
            padding-bottom: max(32px, env(safe-area-inset-bottom));
        }

        .logo { display: block; margin: 0 auto 8px; max-width: min(70%, 240px); max-height: 160px; height: auto; }
        .naziv { margin: 0 0 8px; text-align: center; font-size: 26px; }
        h2 { margin: 0 0 18px; font-size: 20px; text-align: center; }

        label { display: block; margin-top: 10px; font-weight: bold; }

        /* font-size 16px sprječava automatsko zumiranje na iPhoneu */
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 16px;
            min-height: 48px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-family: inherit;
        }
        input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

        button {
            background-color: var(--accent);
            color: var(--accent-fg);
            border: none;
            font-size: 17px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { filter: brightness(0.88); }
        button:active { filter: brightness(0.75); }

        .poruka { margin-top: 15px; padding: 10px; font-weight: bold; text-align: center; border-radius: 6px; background: #ffebee; color: #b71c1c; }
        .poruka:empty { display: none; }
    </style>
</head>
<body>

    <div class="wrap">
        <img id="logo" class="logo" alt="" hidden>
        <h1 id="naziv" class="naziv" hidden></h1>

        <h2>Prijava za admina</h2>

        <form id="forma">
            <label for="lozinka">Lozinka:</label>
            <input type="password" id="lozinka" autocomplete="current-password" required autofocus />
            <button type="submit" id="btnPrijava">Prijavi se</button>
        </form>
        <div id="poruka" class="poruka"></div>
    </div>

    <script>
        // Koliko je boja svijetla (0 = crna, 1 = bijela)
        function osvjetljenje(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        async function ucitajPostavke() {
            try {
                const res = await fetch('/api/postavke');
                const p = await res.json();

                const root = document.documentElement.style;
                root.setProperty('--bg', p.pozadina);
                root.setProperty('--fg', osvjetljenje(p.pozadina) < 0.55 ? '#ffffff' : '#222222');
                root.setProperty('--accent', p.boja);
                root.setProperty('--accent-fg', osvjetljenje(p.boja) < 0.6 ? '#ffffff' : '#111111');

                const logo = document.getElementById('logo');
                const naziv = document.getElementById('naziv');
                naziv.textContent = p.naziv;
                logo.onload = () => { logo.hidden = false; };
                logo.onerror = () => { naziv.hidden = false; };
                logo.src = p.logo;
            } catch (err) {
                console.error('Greška pri dohvaćanju postavki:', err);
            }
        }

        document.getElementById('forma').addEventListener('submit', async (e) => {
            e.preventDefault();
            const poruka = document.getElementById('poruka');
            const gumb = document.getElementById('btnPrijava');
            const lozinka = document.getElementById('lozinka').value;
            poruka.textContent = '';
            gumb.disabled = true;

            try {
                const res = await fetch('/api/prijava', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lozinka })
                });

                if (res.ok) {
                    location.href = '/admin.html';
                    return;
                }
                if (res.status === 401) poruka.textContent = 'Pogrešna lozinka.';
                else if (res.status === 429) poruka.textContent = 'Previše pokušaja. Pokušajte ponovno za nekoliko minuta.';
                else if (res.status === 503) poruka.textContent = 'Lozinka admina nije postavljena na serveru.';
                else poruka.textContent = 'Greška pri prijavi. Pokušajte ponovno.';
            } catch (err) {
                poruka.textContent = 'Nema veze s poslužiteljem. Pokušajte ponovno.';
            }
            gumb.disabled = false;
        });

        ucitajPostavke();
    </script>
</body>
</html>
